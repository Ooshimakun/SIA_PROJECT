<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="cyber-container">
      <header class="cyber-header">
        <div class="logo">LIBRARY <span>MANAGEMENT SYSTEM</span></div>
      </header>

      <main class="grid-layout">
        <aside class="glass-panel">
          <h2>DATABASE // CATALOG</h2>
          <div class="catalog-grid" id="catalogList">
            <div class="loading-text">Fetching live database...</div>
          </div>
        </aside>

        <section class="glass-panel main-panel">
          <h2>INITIALIZE TRANSACTION</h2>
          <form id="borrowForm">
            <div class="input-group">
              <label for="studentId">AUTHORIZATION ID</label>
              <input
                type="text"
                id="studentId"
                placeholder="e.g., 2024-001"
                required
              />
            </div>
            <div class="input-group">
              <label for="bookId">ASSET ID</label>
              <input
                type="text"
                id="bookId"
                placeholder="Enter Catalog ID"
                required
              />
            </div>
            <button type="submit" class="cyber-btn">EXECUTE REQUEST</button>
          </form>

          <div id="responseContainer" class="hidden">
            <div class="terminal-bar">
              <span>> TERMINAL_OUTPUT</span>
            </div>
            <div id="outputLog" class="terminal-body"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
